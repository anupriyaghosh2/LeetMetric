<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>LeetMetric</h1>

        <div class="user-container">
            <input type="text" id="user-input" placeholder="enter your username here">
            <button id="search-btn">Search</button>
        </div>

        <div class="stats-container">
            <div class="circle-item">
                <div class="easy-progress progress-inner">
                    <span id="easy-label">Easy</span>
                </div>
            </div>
            <div class="circle-item">
                <div class="medium-progress progress-inner">
                    <span id="medium-label">Medium</span>
                </div>
            </div>
            <div class="circle-item">
                <div class="hard-progress progress-inner">
                    <span id="hard-label">Hard</span>
                </div>
            </div>
        </div>

        <div class="stats-cards"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
